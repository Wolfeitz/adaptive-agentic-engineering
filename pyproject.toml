[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agentic-engineering"
dynamic = ["version"]
description = "Portable intent bootstrap for Adaptive Agentic Engineering"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10"]

[project.scripts]
aae = "aae.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "aae.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aae.templates" = [
  "AGENTS.md",
  ".gitignore",
  ".aae/*",
  ".aae/**/*",
]

[tool.setuptools.exclude-package-data]
"aae.templates" = ["**/__pycache__/*", "**/*.pyc"]
